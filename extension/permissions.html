<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kino: camera and microphone</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: var(--card-2); }
  .panel { width: min(440px, 100% - 32px); background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 28px; text-align: center; }
  .brand { justify-content: center; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="brand"><img src="icons/48.png" alt="">Kino</div>
    <h1 id="title">Allow camera and microphone</h1>
    <p class="muted" id="text">Click <strong>Allow</strong> in the Chrome prompt. Chrome remembers your choice for Kino.</p>
    <button class="btn primary" id="ask">Ask again</button>
    <p class="err" id="error"></p>
  </div>
  <script src="permissions.js" type="module"></script>
</body>
</html>
